<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 400 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <mask id="m">
      <rect width="400" height="400" fill="#fff"/>
