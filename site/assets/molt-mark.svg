      <path d="M78 150 L40 96 L96 100 Z" fill="#000"/>
      <path d="M322 150 L360 96 L304 100 Z" fill="#000"/>
    </mask>
  </defs>
  <g fill="#f2b33d" stroke="#f2b33d" stroke-linecap="round" mask="url(#m)">
    <!-- carapace -->
    <path d="M60 300 A140 120 0 0 1 340 300 Z" stroke="none"/>
