    <circle cx="78" cy="150" r="46" stroke="none"/>
    <circle cx="322" cy="150" r="46" stroke="none"/>
    <path d="M90 196 L122 226 M310 196 L278 226" fill="none" stroke-width="22"/>
    <!-- eyes -->
    <path d="M168 182 L160 142 M232 182 L240 142" fill="none" stroke-width="14"/>
    <circle cx="160" cy="134" r="18" stroke="none"/>
    <circle cx="240" cy="134" r="18" stroke="none"/>
    <!-- legs -->
    <path d="M70 300 L40 336 M110 300 L92 342 M330 300 L360 336 M290 300 L308 342" fill="none" stroke-width="18"/>
  </g>
</svg>
