# An example script for molt --fake. In place of the model, it answers the requests molt sends,
# one response each, from the top.
# It takes one pass: request -> rejection -> boundary -> side line -> ① -> write -> cargo check
# -> commit approval. It does not read the request, so whatever you ask, src/main.rs is rewritten
# as scripted here.
#
# The profile to go with it is profile.toml in this directory (dbg_macro not known).
# What to type during the pass is in README.md, section "Try it without a model".
#
# tests/fake_pass.rs takes one pass with this script, and tests/fake_example.rs with copies of
# this script and profile.toml. If you change the responses, fix the tests too.

# Main line: with a profile where dbg_macro is not known, dbg! is not allowed, so molt rejects this write.
[[responses]]
tool_calls = [
  { name = "write_file", arguments = { path = "src/main.rs", content = "fn main() {\n    dbg!(1);\n}\n" } },
]

# The rewrite uses dbg! too. At the second rejection, the turn stops at a boundary.
[[responses]]
tool_calls = [
  { name = "write_file", arguments = { path = "src/main.rs", content = "fn main() {\n    let _ = dbg!(1);\n}\n" } },
]

# The explanation of dbg_macro on the side line.
[[responses]]
content = "`dbg!` prints the value of an expression with its file and line to stderr, and returns the value."

# After ①, the same turn goes on. dbg! is known now, so the write goes through.
[[responses]]
tool_calls = [
  { name = "write_file", arguments = { path = "src/main.rs", content = "fn main() {\n    dbg!(1);\n}\n" } },
]

[[responses]]
tool_calls = [{ name = "finish", arguments = { summary = "Printed 1 with `dbg!`." } }]

# The commit message molt proposes after cargo check passes.
[[responses]]
content = "Print 1 with dbg!"
