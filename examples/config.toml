# An example of molt's configuration file. It goes in $MOLT_HOME/config.toml,
# or else $XDG_CONFIG_HOME/molt/config.toml, or else ~/.config/molt/config.toml.
# Without the file, or for a key it does not set, the default applies. Every value below is the default.

[api]
# The URL of an OpenAI-compatible chat API, up to but not including /chat/completions
base_url = "https://api.tokenfactory.nebius.com/v1"
# The name of the environment variable to read the API key from. Do not write the key itself here
api_key_env = "NEBIUS_API_KEY"
# The timeout of one request, in seconds
timeout_secs = 300

[models]
light = "nvidia/Nemotron-3_5-Lightning"
generate = "nvidia/nemotron-3-super-120b-a12b"
reason = "nvidia/Nemotron-3-Ultra-550b-a55b"

# Sent as reasoning_effort as is, only when reasoning_effort is true for the role in [capabilities]
[reasoning_effort]
light = "low"
generate = "medium"
reason = "high"

# molt doctor rewrites these. Until it has checked them, all are false
[capabilities.light]
tool_choice_required = false
json_schema = false
reasoning_effort = false

[capabilities.generate]
tool_choice_required = false
json_schema = false
reasoning_effort = false

[capabilities.reason]
tool_choice_required = false
json_schema = false
reasoning_effort = false

# To use a local OpenAI-compatible endpoint, replace both base_url and api_key_env in [api] above
# as below, with <local-endpoint> as the actual host and port.
# In [models], write the model IDs of that endpoint.
#
# base_url = "http://<local-endpoint>/v1"
# api_key_env = ""
#
# - Unless api_key_env is empty, the key in the default NEBIUS_API_KEY is sent to that endpoint
# - With a key, molt does not send it over http:// to a host other than loopback (localhost,
#   127.0.0.0/8, ::1): it returns an error without making a client. To send a key, use https
# - If the endpoint requires a key, name a variable of its own (e.g. api_key_env = "LOCAL_API_KEY")
# - A local model can take longer than timeout_secs to write one file. If molt stops with
#   "the chat API did not respond within 300 seconds", raise timeout_secs in [api] (e.g. 1200)
