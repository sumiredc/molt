[package]
name = "molt"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "molt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.6", features = ["full", "visit", "extra-traits"] }
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
