[package]
name = "molt"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "molt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = { version = "0.4.5", default-features = false }
syn = { version = "3.0.6", features = ["full", "visit", "extra-traits"] }
toml = "1.1.8"
toml_edit = "0.25.17"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
