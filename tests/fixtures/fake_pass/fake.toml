# The model's side of one pass (`molt --fake`), for `tests/fake_pass.rs`. Each response answers
# the next request molt makes, whichever model role it is for.

# The main line: `dbg!` is not in the empty profile, so molt rejects the write.
[[responses]]
tool_calls = [
  { name = "write_file", arguments = { path = "src/main.rs", content = "fn main() {\n    dbg!(1);\n}\n" } },
]

# The rewrite still uses `dbg!`: rejected again, so the turn stops at a boundary.
[[responses]]
tool_calls = [
  { name = "write_file", arguments = { path = "src/main.rs", content = "fn main() {\n    let _ = dbg!(1);\n}\n" } },
]

# The side line's explanation of `dbg_macro`.
[[responses]]
content = "`dbg!` prints the value of an expression with its file and line to stderr, and returns the value."

# After ①, the same turn goes on: `dbg!` is known now, so the write passes.
[[responses]]
tool_calls = [
  { name = "write_file", arguments = { path = "src/main.rs", content = "fn main() {\n    dbg!(1);\n}\n" } },
]

[[responses]]
tool_calls = [{ name = "finish", arguments = { summary = "Printed 1 with `dbg!`." } }]

# The message molt proposes for the commit, after `cargo check` passed.
[[responses]]
content = "Print 1 with dbg!"
